<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Layout Base y Dashboard — Mockup</title>
<style>
  :root {
    /* Capa de MARCA — solo fills */
    --primary: #58CC02;        --on-primary: #131F24;
    --primary-hover: #49AD00;  --primary-shadow: #58A700;
    --secondary: #1CB0F6;      --on-secondary: #131F24;
    --secondary-hover: #159ADB;--secondary-shadow: #0C7CB3;
    --accent-yellow: #FFC800;  --accent-red: #FF4B4B;  --accent-purple: #CE82FF;
    --streak: #FF9600;         --xp: #FFC800;

    /* Capa de TEXTO — texto, iconos, enlaces, bordes con significado */
    --primary-text: #337601;   --secondary-text: #116D99;
    --red-text: #B33535;       --purple-text: #8352A2;
    --streak-text: #975900;    --xp-text: #836700;

    --ink: #3C3C3C;            --ink-muted: #666666;
    --canvas: #ffffff;  --surface-1: #F7F7F7;  --surface-2: #EBEBEB;
    --border: #E5E5E5;  --border-strong: #767676;
    --focus: var(--secondary-text);

    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px;
    --radius-xl: 28px; --radius-pill: 9999px;
    --shadow-button: 0 4px 0 #58A700;
    --shadow-card: 0 2px 0 #E5E5E5;
    --shadow-elevated: 0 4px 16px rgba(0,0,0,0.1);
    --duration-fast: 80ms; --duration-base: 200ms;
    --easing: cubic-bezier(0.34, 1.56, 0.64, 1);

    --sidebar-width: 248px;
    --sidebar-collapsed-width: 76px;
    --topbar-height: 64px;
  }

  /* Tema oscuro — SOLO por elección explícita del usuario (RN-28/AF-19: nunca por
     prefers-color-scheme). Se activa vía data-theme="dark" en <html>. */
  :root[data-theme="dark"] {
    --primary: #58CC02;        --on-primary: #131F24;
    --primary-hover: #61E002;  --primary-shadow: #3D8B00;
    --secondary: #1CB0F6;      --on-secondary: #131F24;
    --secondary-hover: #45C1F9;--secondary-shadow: #0A6E9E;
    --accent-yellow: #FFC800;  --accent-red: #FF4B4B;  --accent-purple: #CE82FF;
    --streak: #FF9600;         --xp: #FFC800;

    --primary-text: #58CC02;   --secondary-text: #24B3F6;
    --red-text: #FF7B7B;       --purple-text: #D28BFF;
    --streak-text: #FF9600;    --xp-text: #FFC800;

    --ink: #F1F7FB;            --ink-muted: #A3B5BF;
    --canvas: #131F24;  --surface-1: #202F36;  --surface-2: #2B3D45;
    --border: #37464F;  --border-strong: #8398A3;
    /* Excepción documentada del estándar (sección Accesibilidad del DESIGN.md):
       el foco en oscuro usa el token de marca `secondary`, no `secondary-text`. */
    --focus: var(--secondary);

    --shadow-button: 0 4px 0 #3D8B00;
    --shadow-card: 0 2px 0 #37464F;
    --shadow-elevated: 0 4px 16px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink);
    background: var(--surface-1);
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, h3 {
    font-family: "Feather Bold", "Nunito", -apple-system, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  button { font-family: inherit; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- Banner de mockup ---------- */
  .mockup-banner {
    position: sticky; top: 0; z-index: 200;
    background: var(--accent-yellow);
    color: var(--ink);
    text-align: center;
    padding: 8px 16px;
    font-weight: 800;
    letter-spacing: 0.02em;
    border-bottom: 2px solid var(--streak);
  }

  /* ---------- Estructura de la app ---------- */
  .app-shell { display: flex; min-height: calc(100vh - 40px); }

  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(19, 31, 36, 0.55);
    z-index: 90;
  }
  .sidebar-overlay.visible { display: block; }

  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: var(--surface-1);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width var(--duration-base) var(--easing);
  }
  .sidebar.collapsed { width: var(--sidebar-collapsed-width); }

  .sidebar-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 12px;
    border-bottom: 1px solid var(--border);
    min-height: var(--topbar-height);
  }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; flex-shrink: 0;
    background: transparent; border: none; border-radius: var(--radius-md);
    color: var(--ink); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); }

  .brand-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    background: var(--primary); color: var(--on-primary);
    font-weight: 800; font-size: 13px; flex-shrink: 0;
  }
  .brand-name { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; }
  .sidebar.collapsed .brand-name { display: none; }

  .nav-list { list-style: none; margin: 0; padding: 8px; flex: 1; overflow-y: auto; overflow-x: hidden; }
  .nav-sublist { list-style: none; margin: 2px 0 4px; padding: 0 0 0 20px; }

  .nav-item, .nav-subitem {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    width: 100%; min-height: 44px;
    padding: 10px 12px;
    margin: 2px 0;
    background: transparent; border: none;
    border-left: 3px solid transparent;
    border-radius: var(--radius-md);
    color: var(--ink);
    font-weight: 700; font-size: 14.5px;
    text-align: left; cursor: pointer;
  }
  .nav-item:hover, .nav-subitem:hover { background: var(--surface-2); }
  .nav-item.active, .nav-subitem.active {
    background: color-mix(in srgb, var(--primary) 14%, transparent);
    color: var(--primary-text);
    border-left-color: var(--primary);
    font-weight: 800;
  }
  /* Con el menú colapsado, la subsección activa se oculta (no hay ícono propio);
     su ícono padre conserva la marca de "sección activa" (H2-E4). */
  .sidebar.collapsed .nav-parent.has-active-child {
    background: color-mix(in srgb, var(--primary) 14%, transparent);
    color: var(--primary-text);
    border-left-color: var(--primary);
    font-weight: 800;
  }
  .nav-icon { display: inline-flex; flex-shrink: 0; }
  .nav-icon svg { display: block; }
  .nav-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-chevron { display: inline-flex; flex-shrink: 0; transition: transform var(--duration-base) var(--easing); }
  .nav-parent[aria-expanded="true"] .nav-chevron { transform: rotate(180deg); }

  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .nav-chevron,
  .sidebar.collapsed .nav-sublist,
  .sidebar.collapsed .collapse-label { display: none; }
  .sidebar.collapsed .nav-item, .sidebar.collapsed .nav-subitem { justify-content: center; }

  /* Tooltip accesible con menú colapsado (hover Y foco) — se posiciona por JS con
     position:fixed para no quedar recortado por el scroll interno del nav-list. */
  .collapsed-tooltip {
    position: fixed; z-index: 260;
    background: var(--ink); color: var(--canvas);
    padding: 6px 10px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: var(--shadow-elevated);
    pointer-events: none;
  }

  .collapse-btn { justify-content: flex-start; gap: 10px; width: 100%; }
  .collapse-btn .collapse-label { font-size: 13px; }

  /* ---------- Área principal ---------- */
  .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    min-height: var(--topbar-height);
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px;
    background: var(--canvas);
    border-bottom: 2px solid var(--border);
    position: relative;
  }

  #mobile-toggle { display: none; }

  .topbar h1 { font-size: 20px; margin-right: auto; }

  .topbar-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }

  .theme-toggle-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 8px 14px;
    background: transparent; border: 2px solid var(--border);
    border-radius: var(--radius-md); color: var(--ink);
    font-weight: 700; font-size: 13.5px; cursor: pointer;
    white-space: nowrap;
  }
  .theme-toggle-btn:hover { background: var(--surface-1); }

  .avatar-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 6px 12px 6px 6px;
    background: transparent; border: none; border-radius: var(--radius-pill);
    color: var(--ink); cursor: pointer; font-weight: 700; font-size: 13.5px;
  }
  .avatar-btn:hover { background: var(--surface-1); }
  .avatar-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--secondary); color: var(--on-secondary);
    font-weight: 800; font-size: 13px; flex-shrink: 0;
  }
  .avatar-name { display: inline; }

  .popover {
    position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 300px; max-width: 90vw;
    background: var(--canvas); border: 2px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-elevated);
    z-index: 120; padding: 8px;
  }
  .popover-title {
    font-size: 13px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--ink-muted);
    padding: 8px 10px 4px;
  }
  .menu-option {
    display: block; width: 100%; text-align: left;
    min-height: 44px; padding: 10px; background: transparent; border: none;
    border-radius: var(--radius-sm); color: var(--ink); font-weight: 700; font-size: 14.5px;
    cursor: pointer;
  }
  .menu-option:hover { background: var(--surface-1); }

  .notif-item {
    display: block; width: 100%; text-align: left;
    padding: 10px; background: transparent; border: none;
    border-top: 1px solid var(--border);
    color: var(--ink); font-weight: 700; font-size: 13.5px; line-height: 1.45;
    cursor: pointer;
  }
  .notif-item:hover { background: var(--surface-1); }
  .notif-item:first-of-type { border-top: none; }

  /* ---------- Ruta de navegación ---------- */
  .breadcrumb { padding: 10px 20px; background: var(--canvas); border-bottom: 1px solid var(--border); }
  .breadcrumb-list { display: flex; align-items: center; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
  .breadcrumb-list li { display: flex; align-items: center; }
  .crumb-sep { color: var(--ink-muted); font-weight: 700; }
  .crumb-link {
    background: none; border: none; padding: 4px 4px; cursor: pointer;
    color: var(--secondary-text); font-weight: 800; font-size: 13.5px; border-radius: 4px;
  }
  .crumb-link:hover { text-decoration: underline; }
  .crumb-mid { color: var(--ink-muted); font-weight: 700; font-size: 13.5px; padding: 4px; }
  .crumb-current { color: var(--ink); font-weight: 800; font-size: 13.5px; padding: 4px; }

  /* ---------- Contenido ---------- */
  .content { flex: 1; padding: 24px 20px 48px; }

  .dashboard-toolbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .btn-refresh {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 8px 16px;
    background: var(--primary); color: var(--on-primary);
    border: none; border-radius: var(--radius-md);
    font-weight: 800; font-size: 14px; cursor: pointer;
    box-shadow: var(--shadow-button);
    transition: transform var(--duration-fast) var(--easing), box-shadow var(--duration-fast) var(--easing);
  }
  .btn-refresh:hover { background: var(--primary-hover); }
  .btn-refresh:active { transform: translateY(4px); box-shadow: none; }

  .cards-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) {
    .cards-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .indicator-card {
    background: var(--canvas); border: 2px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    padding: 18px 18px 20px; min-height: 140px;
  }
  .indicator-name { font-size: 13px; font-weight: 800; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 12px; }
  .indicator-value { font-size: 30px; font-weight: 800; color: var(--ink); margin: 0 0 6px; line-height: 1.1; }
  .indicator-variation { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13.5px; font-weight: 800; }
  .trend-icon { display: inline-flex; flex-shrink: 0; }
  .trend-up { color: var(--primary-text); }
  .trend-down { color: var(--red-text); }
  .trend-neutral { color: var(--ink-muted); }
  .indicator-empty { color: var(--ink-muted); font-weight: 700; font-size: 13.5px; margin: 0; }
  .indicator-error { color: var(--red-text); font-weight: 700; font-size: 13.5px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }

  .btn-retry {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 40px; padding: 6px 14px;
    background: var(--canvas); color: var(--secondary-text);
    border: 2px solid var(--border-strong); border-radius: var(--radius-md);
    font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .btn-retry:hover { background: var(--surface-1); }

  .skeleton-line {
    height: 14px; border-radius: var(--radius-sm);
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 10px;
  }
  .skeleton-value { width: 60%; height: 26px; }
  .skeleton-variation { width: 80%; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* ---------- Pantalla En construcción ---------- */
  .construction { max-width: 560px; margin: 20px auto 0; text-align: center; }
  .btn-link {
    background: none; border: none; color: var(--secondary-text);
    font-weight: 800; font-size: 14px; cursor: pointer; padding: 8px 4px;
    margin-bottom: 24px; display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px;
  }
  .btn-link:hover { text-decoration: underline; }
  .construction-body {
    background: var(--canvas); border: 2px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    padding: 40px 24px;
  }
  .construction-icon { color: var(--streak-text); margin-bottom: 12px; display: flex; justify-content: center; }
  .construction-body h2 { font-size: 22px; margin-bottom: 10px; }
  .construction-body p { color: var(--ink-muted); font-weight: 700; margin: 0; }

  /* ---------- Toast ---------- */
  .toast-region { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--ink); color: var(--canvas);
    padding: 12px 20px; border-radius: var(--radius-md);
    font-weight: 700; font-size: 13.5px; box-shadow: var(--shadow-elevated);
    max-width: 90vw;
  }
  :root[data-theme="dark"] .toast { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border-strong); }

  /* ---------- Panel de demostración (mockup) ---------- */
  .demo-fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 250;
    min-height: 44px; padding: 10px 16px;
    background: var(--accent-purple); color: var(--on-primary);
    border: none; border-radius: var(--radius-pill);
    font-weight: 800; font-size: 13px; cursor: pointer;
    box-shadow: var(--shadow-elevated);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .demo-panel {
    position: fixed; bottom: 76px; right: 20px; z-index: 250;
    width: 320px; max-height: 70vh; overflow-y: auto;
    background: var(--canvas); border: 2px solid var(--purple-text);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-elevated);
    padding: 16px;
  }
  .demo-panel h2 { font-size: 15px; margin-bottom: 4px; }
  .demo-panel .demo-sub { color: var(--ink-muted); font-size: 12.5px; font-weight: 700; margin: 0 0 14px; }
  .demo-group { margin-bottom: 14px; }
  .demo-group-title { font-size: 12.5px; font-weight: 800; margin-bottom: 6px; }
  .demo-btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .demo-state-btn {
    min-height: 32px; padding: 5px 10px;
    background: var(--surface-1); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); color: var(--ink);
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .demo-state-btn:hover { background: var(--surface-2); }
  .demo-close { position: absolute; top: 10px; right: 10px; }

  /* ---------- Responsive: teléfono ---------- */
  @media (max-width: 820px) {
    #mobile-toggle { display: inline-flex; }
    .avatar-name { display: none; }

    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 280px;
      transform: translateX(-100%);
      transition: transform var(--duration-base) var(--easing);
      z-index: 100;
      box-shadow: var(--shadow-elevated);
    }
    .sidebar.mobile-open { transform: translateX(0); }
    .sidebar.collapsed { width: 280px; }
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-chevron,
    .sidebar.collapsed .nav-sublist,
    .sidebar.collapsed .brand-name,
    .sidebar.collapsed .collapse-label { display: revert; }
    .sidebar.collapsed .nav-item, .sidebar.collapsed .nav-subitem { justify-content: flex-start; }

    #collapse-toggle { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="mockup-banner" role="note">MOCKUP — datos de ejemplo</div>

  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="sidebar-header">
        <button type="button" id="collapse-toggle" class="icon-btn collapse-btn" aria-label="Colapsar menú">
          <span class="nav-icon" id="collapse-icon"></span>
          <span class="collapse-label" aria-hidden="true">Colapsar menú</span>
        </button>
        <span class="brand-mark" aria-hidden="true">AM</span>
        <span class="brand-name">AgroMigiva</span>
      </div>

      <nav aria-label="Secciones del sistema">
        <ul class="nav-list" id="nav-list">
          <li>
            <button type="button" class="nav-item active" data-goto="inicio" aria-label="Inicio" data-tooltip="Inicio">
              <span class="nav-icon" data-icon="home"></span><span class="nav-label" aria-hidden="true">Inicio</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item nav-parent" data-toggle="comercial" aria-expanded="false" aria-controls="submenu-comercial" aria-label="Comercial" data-tooltip="Comercial">
              <span class="nav-icon" data-icon="briefcase"></span><span class="nav-label" aria-hidden="true">Comercial</span><span class="nav-chevron" data-icon="chevron"></span>
            </button>
            <ul class="nav-sublist" id="submenu-comercial" hidden>
              <li><button type="button" class="nav-subitem" data-goto="ordenes">Órdenes</button></li>
              <li><button type="button" class="nav-subitem" data-goto="clientes">Clientes</button></li>
            </ul>
          </li>
          <li>
            <button type="button" class="nav-item nav-parent" data-toggle="packing" aria-expanded="false" aria-controls="submenu-packing" aria-label="Packing" data-tooltip="Packing">
              <span class="nav-icon" data-icon="box"></span><span class="nav-label" aria-hidden="true">Packing</span><span class="nav-chevron" data-icon="chevron"></span>
            </button>
            <ul class="nav-sublist" id="submenu-packing" hidden>
              <li><button type="button" class="nav-subitem" data-goto="lotes">Lotes</button></li>
              <li><button type="button" class="nav-subitem" data-goto="despachos">Despachos</button></li>
            </ul>
          </li>
          <li>
            <button type="button" class="nav-item" data-goto="almacen" aria-label="Almacén" data-tooltip="Almacén">
              <span class="nav-icon" data-icon="archive"></span><span class="nav-label" aria-hidden="true">Almacén</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item" data-goto="reportes" aria-label="Reportes" data-tooltip="Reportes">
              <span class="nav-icon" data-icon="chart"></span><span class="nav-label" aria-hidden="true">Reportes</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item" data-goto="configuracion" aria-label="Configuración" data-tooltip="Configuración">
              <span class="nav-icon" data-icon="settings"></span><span class="nav-label" aria-hidden="true">Configuración</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" id="mobile-toggle" class="icon-btn" aria-label="Abrir menú">
          <span class="nav-icon" data-icon="menu"></span>
        </button>
        <h1 id="page-title" aria-live="polite" aria-atomic="true">Inicio</h1>
        <div class="topbar-actions">
          <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-pressed="false">
            <span class="nav-icon" id="theme-icon" data-icon="moon"></span>
            <span id="theme-label">Tema oscuro</span>
          </button>
          <button type="button" id="notif-bell" class="icon-btn" aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false">
            <span class="nav-icon" data-icon="bell"></span>
          </button>
          <button type="button" id="user-avatar" class="avatar-btn" aria-label="Alfredo Anchante, menú de usuario" aria-haspopup="true" aria-expanded="false">
            <span class="avatar-circle" aria-hidden="true">AA</span>
            <span class="avatar-name">Alfredo Anchante</span>
          </button>

          <div class="popover" id="notif-panel" role="dialog" aria-label="Notificaciones" hidden>
            <p class="popover-title">Notificaciones</p>
            <button type="button" class="notif-item">La orden OC-2418 de Agroexportadora del Norte quedó pendiente de aprobación.</button>
            <button type="button" class="notif-item">El lote L-0912 de palta Hass completó su proceso de packing.</button>
            <button type="button" class="notif-item">El despacho DS-3307 con destino Callao salió con 18,400 kilos.</button>
          </div>

          <div class="popover" id="user-menu" role="menu" aria-label="Menú de usuario" hidden>
            <button type="button" class="menu-option" role="menuitem" data-user-action="perfil">Mi perfil</button>
            <button type="button" class="menu-option" role="menuitem" data-user-action="salir">Cerrar sesión</button>
          </div>
        </div>
      </header>

      <nav class="breadcrumb" aria-label="Ruta de navegación">
        <ol class="breadcrumb-list" id="breadcrumb-list"></ol>
      </nav>

      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div class="collapsed-tooltip" id="collapsed-tooltip" role="tooltip" hidden></div>

  <button type="button" class="demo-fab" id="demo-fab" aria-expanded="false" aria-controls="demo-panel">
    <span class="nav-icon" data-icon="settings"></span> Controles de demostración
  </button>
  <div class="demo-panel" id="demo-panel" role="dialog" aria-label="Controles de demostración del mockup" hidden>
    <button type="button" class="icon-btn demo-close" id="demo-close" aria-label="Cerrar controles de demostración">
      <span class="nav-icon" data-icon="close"></span>
    </button>
    <h2>Controles de demostración</h2>
    <p class="demo-sub">Fuerza el estado de cada tarjeta de Inicio para revisar los escenarios H4 (esto no existe en el sistema real).</p>
    <div id="demo-groups"></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ---------------- Iconos SVG inline ---------------- */
    var ICON_PATHS = {
      home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/>',
      briefcase: '<rect x="2" y="7" width="20" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
      box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
      archive: '<rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/><path d="M10 12h4"/>',
      chart: '<path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
      chevron: '<path d="M6 9l6 6 6-6"/>',
      bell: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
      menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
      close: '<path d="M18 6L6 18M6 6l12 12"/>',
      up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
      down: '<path d="M12 5v14M19 12l-7 7-7-7"/>',
      dash: '<path d="M5 12h14"/>',
      refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.6-3.4L23 10"/><path d="M20.5 15a9 9 0 0 1-14.6 3.4L1 14"/>',
      warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
      wrench: '<path d="M14.7 6.3a4 4 0 1 0-5.4 5.4L2 19l3 3 7.3-7.3a4 4 0 0 0 5.4-5.4l-3 3-2-2z"/>'
    };

    function svgIcon(name, size) {
      var s = size || 20;
      return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (ICON_PATHS[name] || '') + '</svg>';
    }

    document.querySelectorAll('[data-icon]').forEach(function (el) {
      el.innerHTML = svgIcon(el.getAttribute('data-icon'));
    });

    /* ---------------- Datos de dominio (spec H3/H4) ---------------- */
    var INDICATORS = [
      { id: 'ordenes-mes', name: 'Órdenes del mes', value: '128', variation: '+12% vs. mes anterior', trend: 'up' },
      { id: 'kilos-despachados', name: 'Kilos despachados', value: '45,320', variation: '+8% vs. mes anterior', trend: 'up' },
      { id: 'clientes-activos', name: 'Clientes activos', value: '37', variation: 'Sin cambio vs. mes anterior', trend: 'neutral' },
      { id: 'ordenes-pendientes', name: 'Órdenes pendientes', value: '9', variation: '-3% vs. mes anterior', trend: 'down' }
    ];
    var cardStates = {}; // id -> 'loading' | 'data' | 'empty' | 'error'
    INDICATORS.forEach(function (ind) { cardStates[ind.id] = 'loading'; });

    var SECTIONS = {
      inicio: { title: 'Inicio', crumb: ['Inicio'] },
      ordenes: { title: 'Órdenes', crumb: ['Inicio', 'Comercial', 'Órdenes'] },
      clientes: { title: 'Clientes', crumb: ['Inicio', 'Comercial', 'Clientes'] },
      lotes: { title: 'Lotes', crumb: ['Inicio', 'Packing', 'Lotes'] },
      despachos: { title: 'Despachos', crumb: ['Inicio', 'Packing', 'Despachos'] },
      almacen: { title: 'Almacén', crumb: ['Inicio', 'Almacén'] },
      reportes: { title: 'Reportes', crumb: ['Inicio', 'Reportes'] },
      configuracion: { title: 'Configuración', crumb: ['Inicio', 'Configuración'] }
    };

    var currentSection = 'inicio';
    var firstInicioLoad = true;

    /* ---------------- Elementos ---------------- */
    var pageTitle = document.getElementById('page-title');
    var breadcrumbList = document.getElementById('breadcrumb-list');
    var contentEl = document.getElementById('content');
    var sidebar = document.getElementById('sidebar');
    var sidebarOverlay = document.getElementById('sidebar-overlay');
    var collapseToggle = document.getElementById('collapse-toggle');
    var collapseIcon = document.getElementById('collapse-icon');
    var mobileToggle = document.getElementById('mobile-toggle');
    var themeToggle = document.getElementById('theme-toggle');
    var themeIcon = document.getElementById('theme-icon');
    var themeLabel = document.getElementById('theme-label');
    var notifBell = document.getElementById('notif-bell');
    var notifPanel = document.getElementById('notif-panel');
    var userAvatarBtn = document.getElementById('user-avatar');
    var userMenu = document.getElementById('user-menu');
    var toastRegion = document.getElementById('toast-region');
    var demoFab = document.getElementById('demo-fab');
    var demoPanel = document.getElementById('demo-panel');
    var demoClose = document.getElementById('demo-close');
    var demoGroups = document.getElementById('demo-groups');

    /* ---------------- Utilidades ---------------- */
    function trendIcon(trend) {
      if (trend === 'up') return svgIcon('up', 16);
      if (trend === 'down') return svgIcon('down', 16);
      return svgIcon('dash', 16);
    }

    function bodyHtmlForState(ind, state) {
      if (state === 'loading') {
        return '<div class="skeleton-line skeleton-value"></div><div class="skeleton-line skeleton-variation"></div>';
      }
      if (state === 'empty') {
        return '<p class="indicator-empty">Sin información para este periodo</p>';
      }
      if (state === 'error') {
        return '<p class="indicator-error">' + svgIcon('warn', 16) + '<span>No se pudo obtener este indicador</span></p>' +
          '<button type="button" class="btn-retry" data-retry="' + ind.id + '">' + svgIcon('refresh', 14) + '<span>Reintentar</span></button>';
      }
      // data
      return '<p class="indicator-value">' + ind.value + '</p>' +
        '<p class="indicator-variation trend-' + ind.trend + '"><span class="trend-icon">' + trendIcon(ind.trend) + '</span>' + ind.variation + '</p>';
    }

    function setCardState(id, state) {
      cardStates[id] = state;
      var body = document.querySelector('.indicator-card[data-card="' + id + '"] .indicator-body');
      if (body) {
        var ind = INDICATORS.filter(function (i) { return i.id === id; })[0];
        body.innerHTML = bodyHtmlForState(ind, state);
      }
    }

    function refreshAllCards() {
      INDICATORS.forEach(function (ind) { setCardState(ind.id, 'loading'); });
      setTimeout(function () {
        INDICATORS.forEach(function (ind) { setCardState(ind.id, 'data'); });
      }, 900);
    }

    function retryIndicator(id) {
      setCardState(id, 'loading');
      setTimeout(function () { setCardState(id, 'data'); }, 900);
    }

    function cardHtml(ind) {
      return '<div class="indicator-card" data-card="' + ind.id + '">' +
        '<p class="indicator-name">' + ind.name + '</p>' +
        '<div class="indicator-body" aria-live="polite">' + bodyHtmlForState(ind, cardStates[ind.id]) + '</div>' +
        '</div>';
    }

    function dashboardHtml() {
      return '<div class="dashboard">' +
        '<div class="dashboard-toolbar">' +
        '<button type="button" id="refresh-all-btn" class="btn-refresh">' + svgIcon('refresh', 16) + '<span>Actualizar</span></button>' +
        '</div>' +
        '<div class="cards-grid">' + INDICATORS.map(cardHtml).join('') + '</div>' +
        '</div>';
    }

    function constructionHtml(title) {
      return '<div class="construction">' +
        '<button type="button" class="btn-link" data-goto="inicio">← Volver a Inicio</button>' +
        '<div class="construction-body">' +
        '<div class="construction-icon">' + svgIcon('wrench', 36) + '</div>' +
        '<h2>En construcción</h2>' +
        '<p>La pantalla ' + title + ' estará disponible en una entrega posterior.</p>' +
        '</div></div>';
    }

    function renderBreadcrumb(key) {
      var parts = SECTIONS[key].crumb;
      var html = '';
      parts.forEach(function (label, idx) {
        var isFirst = idx === 0;
        var isLast = idx === parts.length - 1;
        if (idx > 0) html += '<li class="crumb-sep">/</li>';
        if (isFirst && key !== 'inicio') {
          html += '<li><button type="button" class="crumb-link" data-goto="inicio">' + label + '</button></li>';
        } else if (isLast) {
          html += '<li><span class="crumb-current" aria-current="page">' + label + '</span></li>';
        } else {
          html += '<li><span class="crumb-mid">' + label + '</span></li>';
        }
      });
      breadcrumbList.innerHTML = html;
    }

    var SUB_PARENT = { ordenes: 'comercial', clientes: 'comercial', lotes: 'packing', despachos: 'packing' };

    function setActiveNav(key) {
      document.querySelectorAll('.nav-item[data-goto], .nav-subitem').forEach(function (el) {
        var isActive = el.getAttribute('data-goto') === key;
        el.classList.toggle('active', isActive);
        if (isActive) el.setAttribute('aria-current', 'page');
        else el.removeAttribute('aria-current');
      });
      // Con el menú colapsado la subsección activa no tiene ícono propio: su
      // padre conserva la marca visual de sección activa (H2-E4).
      document.querySelectorAll('.nav-parent').forEach(function (el) {
        el.classList.remove('has-active-child');
      });
      var parentKey = SUB_PARENT[key];
      if (parentKey) {
        var parentBtn = document.querySelector('[data-toggle="' + parentKey + '"]');
        if (parentBtn) parentBtn.classList.add('has-active-child');
      }
    }

    function renderContent(key) {
      var section = SECTIONS[key];
      if (key === 'inicio') {
        contentEl.innerHTML = dashboardHtml();
        if (firstInicioLoad) {
          firstInicioLoad = false;
          refreshAllCards();
        }
      } else {
        contentEl.innerHTML = constructionHtml(section.title);
      }
    }

    function navigate(key) {
      if (!SECTIONS[key]) return;
      currentSection = key;
      pageTitle.textContent = SECTIONS[key].title;
      renderBreadcrumb(key);
      setActiveNav(key);
      renderContent(key);
      closeMobileMenu();
    }

    /* ---------------- Tooltip del menú colapsado (H2-E3) ---------------- */
    var collapsedTooltip = document.getElementById('collapsed-tooltip');
    function showCollapsedTooltip(el) {
      if (!sidebar.classList.contains('collapsed')) return;
      var text = el.getAttribute('data-tooltip');
      if (!text) return;
      var rect = el.getBoundingClientRect();
      collapsedTooltip.textContent = text;
      collapsedTooltip.style.top = (rect.top + rect.height / 2) + 'px';
      collapsedTooltip.style.left = (rect.right + 10) + 'px';
      collapsedTooltip.style.transform = 'translateY(-50%)';
      collapsedTooltip.hidden = false;
    }
    function hideCollapsedTooltip() { collapsedTooltip.hidden = true; }

    document.querySelectorAll('.nav-item[data-tooltip]').forEach(function (el) {
      el.addEventListener('mouseenter', function () { showCollapsedTooltip(el); });
      el.addEventListener('mouseleave', hideCollapsedTooltip);
      el.addEventListener('focus', function () { showCollapsedTooltip(el); });
      el.addEventListener('blur', hideCollapsedTooltip);
    });

    /* ---------------- Colapsar / expandir menú (desktop) ---------------- */
    function setCollapsed(collapsed) {
      sidebar.classList.toggle('collapsed', collapsed);
      collapseToggle.setAttribute('aria-label', collapsed ? 'Expandir menú' : 'Colapsar menú');
      collapseIcon.innerHTML = svgIcon(collapsed ? 'menu' : 'close', 20);
      var label = document.querySelector('.collapse-label');
      if (label) label.textContent = collapsed ? 'Expandir menú' : 'Colapsar menú';
      hideCollapsedTooltip();
    }
    collapseToggle.addEventListener('click', function () {
      setCollapsed(!sidebar.classList.contains('collapsed'));
    });

    /* ---------------- Menú deslizable en teléfono ---------------- */
    var mobileMenuOpen = false;
    function openMobileMenu() {
      mobileMenuOpen = true;
      sidebar.classList.add('mobile-open');
      sidebarOverlay.classList.add('visible');
      mobileToggle.setAttribute('aria-label', 'Cerrar menú');
      mobileToggle.setAttribute('aria-expanded', 'true');
    }
    function closeMobileMenu() {
      if (!mobileMenuOpen) return;
      mobileMenuOpen = false;
      sidebar.classList.remove('mobile-open');
      sidebarOverlay.classList.remove('visible');
      mobileToggle.setAttribute('aria-label', 'Abrir menú');
      mobileToggle.setAttribute('aria-expanded', 'false');
    }
    mobileToggle.addEventListener('click', function () {
      if (mobileMenuOpen) closeMobileMenu();
      else openMobileMenu();
    });
    sidebarOverlay.addEventListener('click', closeMobileMenu);

    /* ---------------- Submenús Comercial / Packing ---------------- */
    function toggleSubmenu(key) {
      var btn = document.querySelector('[data-toggle="' + key + '"]');
      var list = document.getElementById('submenu-' + key);
      var expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      list.hidden = expanded;
    }

    /* ---------------- Tema claro / oscuro ---------------- */
    var THEME_KEY = 'agromigiva-layout-theme';
    function applyTheme(theme, persist) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.setAttribute('aria-pressed', 'true');
        themeIcon.innerHTML = svgIcon('sun', 18);
        themeLabel.textContent = 'Tema claro';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeToggle.setAttribute('aria-pressed', 'false');
        themeIcon.innerHTML = svgIcon('moon', 18);
        themeLabel.textContent = 'Tema oscuro';
      }
      if (persist) {
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* almacenamiento no disponible */ }
      }
    }
    themeToggle.addEventListener('click', function () {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark', true);
    });

    (function initTheme() {
      var saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* almacenamiento no disponible */ }
      applyTheme(saved === 'dark' ? 'dark' : 'light', false);
    })();

    /* ---------------- Panel de notificaciones / menú de usuario ---------------- */
    var notifOpen = false;
    var userMenuOpen = false;

    function openNotif() {
      closeUserMenu();
      notifOpen = true;
      notifPanel.hidden = false;
      notifBell.setAttribute('aria-expanded', 'true');
    }
    function closeNotif() {
      if (!notifOpen) return;
      notifOpen = false;
      notifPanel.hidden = true;
      notifBell.setAttribute('aria-expanded', 'false');
    }
    function openUserMenu() {
      closeNotif();
      userMenuOpen = true;
      userMenu.hidden = false;
      userAvatarBtn.setAttribute('aria-expanded', 'true');
    }
    function closeUserMenu() {
      if (!userMenuOpen) return;
      userMenuOpen = false;
      userMenu.hidden = true;
      userAvatarBtn.setAttribute('aria-expanded', 'false');
    }

    notifBell.addEventListener('click', function () { notifOpen ? closeNotif() : openNotif(); });
    userAvatarBtn.addEventListener('click', function () { userMenuOpen ? closeUserMenu() : openUserMenu(); });

    /* ---------------- Toast (avisos de "en entrega posterior") ---------------- */
    function showToast(msg) {
      var el = document.createElement('div');
      el.className = 'toast';
      el.setAttribute('role', 'status');
      el.textContent = msg;
      toastRegion.appendChild(el);
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 4500);
    }

    /* ---------------- Panel de demostración ---------------- */
    var demoOpen = false;
    function buildDemoPanel() {
      var stateLabels = { loading: 'Cargando', data: 'Con datos', empty: 'Vacío', error: 'Problema' };
      var html = '';
      INDICATORS.forEach(function (ind) {
        html += '<div class="demo-group"><p class="demo-group-title">' + ind.name + '</p><div class="demo-btn-row">';
        ['loading', 'data', 'empty', 'error'].forEach(function (st) {
          html += '<button type="button" class="demo-state-btn" data-demo="' + ind.id + '" data-state="' + st + '">' + stateLabels[st] + '</button>';
        });
        html += '</div></div>';
      });
      demoGroups.innerHTML = html;
    }
    buildDemoPanel();

    function openDemoPanel() {
      demoOpen = true;
      demoPanel.hidden = false;
      demoFab.setAttribute('aria-expanded', 'true');
    }
    function closeDemoPanel() {
      if (!demoOpen) return;
      demoOpen = false;
      demoPanel.hidden = true;
      demoFab.setAttribute('aria-expanded', 'false');
    }
    demoFab.addEventListener('click', function () { demoOpen ? closeDemoPanel() : openDemoPanel(); });
    demoClose.addEventListener('click', closeDemoPanel);

    /* ---------------- Delegación de clics ---------------- */
    document.addEventListener('click', function (e) {
      var t = e.target;

      var gotoEl = t.closest('[data-goto]');
      if (gotoEl) { navigate(gotoEl.getAttribute('data-goto')); return; }

      var toggleEl = t.closest('[data-toggle]');
      if (toggleEl) { toggleSubmenu(toggleEl.getAttribute('data-toggle')); return; }

      var retryEl = t.closest('[data-retry]');
      if (retryEl) { retryIndicator(retryEl.getAttribute('data-retry')); return; }

      var refreshEl = t.closest('#refresh-all-btn');
      if (refreshEl) { refreshAllCards(); return; }

      var demoBtn = t.closest('[data-demo]');
      if (demoBtn) { setCardState(demoBtn.getAttribute('data-demo'), demoBtn.getAttribute('data-state')); return; }

      var userAction = t.closest('[data-user-action]');
      if (userAction) {
        var action = userAction.getAttribute('data-user-action');
        closeUserMenu();
        if (action === 'salir') {
          showToast('Cerrar sesión estará disponible cuando se integre el inicio de sesión.');
        } else if (action === 'perfil') {
          showToast('Mi perfil estará disponible en una entrega posterior.');
        }
        return;
      }

      // Clic fuera de los paneles abiertos
      if (notifOpen && !t.closest('#notif-panel') && !t.closest('#notif-bell')) closeNotif();
      if (userMenuOpen && !t.closest('#user-menu') && !t.closest('#user-avatar')) closeUserMenu();
      if (mobileMenuOpen && !t.closest('#sidebar') && !t.closest('#mobile-toggle')) closeMobileMenu();
      if (demoOpen && !t.closest('#demo-panel') && !t.closest('#demo-fab')) closeDemoPanel();
    });

    /* ---------------- Teclado: Escape cierra paneles ---------------- */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (notifOpen) { closeNotif(); notifBell.focus(); }
      else if (userMenuOpen) { closeUserMenu(); userAvatarBtn.focus(); }
      else if (demoOpen) { closeDemoPanel(); demoFab.focus(); }
      else if (mobileMenuOpen) { closeMobileMenu(); mobileToggle.focus(); }
    });

    /* ---------------- Estado inicial ---------------- */
    navigate('inicio');
  })();
  </script>
</body>
</html>
